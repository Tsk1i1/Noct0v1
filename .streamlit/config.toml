[theme]
base = "light"
font = "sans serif"
primaryColor = "#1d4ed8"

[theme.light]
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5fc"
textColor = "#172033"
linkColor = "#1d4ed8"
borderColor = "#d9e2f0"
chartCategoricalColors = ["#3475cb", "#687f9d", "#36869e", "#8399bc", "#586dac", "#98aecb"]

[theme.dark]
primaryColor = "#2563eb"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#142033"
textColor = "#e8eef8"
linkColor = "#60a5fa"
borderColor = "#34465f"
chartCategoricalColors = ["#60a5fa", "#a4b9d7", "#67b9d1", "#8eabdf", "#a1aee5", "#c2cfdf"]

[client]
toolbarMode = "viewer"
showSidebarNavigation = false
