[theme]
# Definir [theme.light] e [theme.dark] separadamente (em vez de só cores
# soltas aqui) é a forma documentada de dar ao Streamlit os dois temas
# completos — é isso que faz o alternador aparecer no menu Settings com
# as SUAS cores, em vez das genéricas do Streamlit.
primaryColor = "#1a73e8"
font = "sans serif"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f9"
textColor = "#202124"

[theme.dark]
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1c1f26"
textColor = "#f0f2f6"

[client]
# "auto" mostra as opções de desenvolvedor (Rerun/Clear cache) só pra quem
# está logado como dono do app no Streamlit Cloud; qualquer outra pessoa
# (inclusive quem for avaliar) vê o menu enxuto, mas com o Settings mantido.
toolbarMode = "auto"
