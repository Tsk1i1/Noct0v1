[theme]
# Definir [theme.light] e [theme.dark] 
primaryColor = "#1a73e8"
font = "sans serif"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f9"
textColor = "#202124"

[theme.dark]
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1c1f26"
textColor = "#f0f2f6"

[client]
# "auto" mostra as opções de desenvolvedor  só pra quem
# está logado como dono do app, qualquer outra pessoa
# vê o menu enxuto, mas com o Settings mantido.
toolbarMode = "auto"
