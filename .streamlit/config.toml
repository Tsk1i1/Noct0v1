[theme]
# Só a cor de destaque é fixa; NÃO definimos backgroundColor/textColor
# aqui de propósito — isso é o que trava o app em modo claro e impede o
# alternador de tema nativo do Streamlit de funcionar corretamente.
primaryColor = "#1a73e8"
font = "sans serif"

[client]
# "viewer" esconde o menu de desenvolvedor (Rerun/Clear cache/Record screen)
# mas MANTÉM o menu "Settings", que é onde fica o alternador de tema
# claro/escuro oficial do Streamlit — ele reconfigura todos os componentes
# nativos corretamente (inclusive dropdowns e menus), sem depender de CSS.
toolbarMode = "viewer"
